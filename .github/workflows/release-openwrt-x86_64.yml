name: Release OpenWrt x86_64

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name used for package naming and release tag"
        required: false
        type: string
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  release-openwrt-x86_64:
    name: Release OpenWrt x86_64 packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: sing-box
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ~1.24.0

      - name: Calculate version
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            BASE_VERSION=$(CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go run -v ./cmd/internal/read_tag --ci --nightly 2>/dev/null || true)
            if [ -z "$BASE_VERSION" ] || [[ "$BASE_VERSION" == *"unknown"* ]]; then
              BASE_VERSION="1.14.0-alpha.8"
            fi
            BASE_VERSION="${BASE_VERSION#v}"
            VERSION="v${BASE_VERSION}-build.${{ github.run_number }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          PKG_VERSION="${VERSION//-/\~}"
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      - name: Clone cronet-go
        shell: bash
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          git -C ~/cronet-go fetch --depth=1 origin "$CRONET_GO_VERSION"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: Regenerate Debian keyring
        shell: bash
        run: |
          set -xeuo pipefail
          rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          cd ~/cronet-go
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

      - name: Cache Chromium toolchain
        id: cache-chromium-toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/cronet-go/naiveproxy/src/third_party/llvm-build/
            ~/cronet-go/naiveproxy/src/gn/out/
            ~/cronet-go/naiveproxy/src/chrome/build/pgo_profiles/
            ~/cronet-go/naiveproxy/src/out/sysroot-build/
          key: chromium-toolchain-amd64-musl-${{ hashFiles('sing-box/.github/CRONET_GO_VERSION') }}

      - name: Download Chromium toolchain
        shell: bash
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/amd64 --libc=musl download-toolchain

      - name: Set Chromium toolchain environment
        shell: bash
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/amd64 --libc=musl env >> "$GITHUB_ENV"

      - name: Set build flags
        shell: bash
        run: |
          set -euo pipefail
          TAGS="$(cat release/DEFAULT_BUILD_TAGS),with_musl"
          echo "BUILD_TAGS=$TAGS" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "$GITHUB_ENV"

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Make sure go mod tidy is run before building to resolve any replace directives properly if needed.
          go mod tidy || true
          go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package OpenWrt IPK
        shell: bash
        run: |
          set -euo pipefail
          sudo gem install fpm
          cp .fpm_openwrt .fpm
          fpm -t deb \
            -v "$PKG_VERSION" \
            -p "dist/openwrt.deb" \
            --architecture all \
            dist/sing-box=/usr/bin/sing-box
          .github/deb2ipk.sh "x86_64" "dist/openwrt.deb" "dist/sing-box_${VERSION}_openwrt_x86_64.ipk"
          rm -f dist/openwrt.deb

      - name: Install apk-tools
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v /usr/local/bin:/mnt alpine:edge sh -c "apk add --no-cache apk-tools-static && cp /sbin/apk.static /mnt/apk && chmod +x /mnt/apk"

      - name: Package OpenWrt APK
        shell: bash
        run: |
          set -euo pipefail
          .github/build_openwrt_apk.sh \
            "x86_64" \
            "${VERSION}" \
            "dist/sing-box" \
            "dist/sing-box_${VERSION}_openwrt_x86_64.apk"

      - name: Generate OpenWrt install script
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}"
          cat > dist/install_openwrt_package.sh <<EOF
          #!/usr/bin/env sh
          
          set -eu
          
          APK_URL="${RELEASE_URL}/sing-box_${VERSION}_openwrt_x86_64.apk"
          IPK_URL="${RELEASE_URL}/sing-box_${VERSION}_openwrt_x86_64.ipk"
          
          TMP_DIR="\${TMPDIR:-/tmp}"
          PACKAGE_FILE=""
          
          require_openwrt() {
              if [ ! -f /etc/os-release ]; then
                  echo "This script only supports OpenWrt."
                  exit 1
              fi
          
              if ! grep -q "OPENWRT_ARCH" /etc/os-release 2>/dev/null && ! grep -qi "openwrt" /etc/openwrt_release 2>/dev/null; then
                  echo "This script only supports OpenWrt."
                  exit 1
              fi
          }
          
          detect_installer() {
              if command -v apk >/dev/null 2>&1; then
                  PACKAGE_FILE="\$TMP_DIR/sing-box.apk"
                  PACKAGE_URL="\$APK_URL"
                  INSTALL_CMD="apk add --allow-untrusted"
                  return
              fi
          
              if command -v opkg >/dev/null 2>&1; then
                  PACKAGE_FILE="\$TMP_DIR/sing-box.ipk"
                  PACKAGE_URL="\$IPK_URL"
                  INSTALL_CMD="opkg install"
                  return
              fi
          
              echo "Neither apk nor opkg is available."
              exit 1
          }
          
          download_package() {
              echo "Downloading \$PACKAGE_URL"
              if command -v curl >/dev/null 2>&1; then
                  curl --fail -L -o "\$PACKAGE_FILE" "\$PACKAGE_URL"
                  return
              fi
          
              if command -v wget >/dev/null 2>&1; then
                  wget -O "\$PACKAGE_FILE" "\$PACKAGE_URL"
                  return
              fi
          
              echo "curl or wget is required."
              exit 1
          }
          
          install_package() {
              echo "Installing \$PACKAGE_FILE"
              if [ "\$INSTALL_CMD" = "opkg install" ]; then
                  opkg update
              fi
              sh -c "\$INSTALL_CMD \"\$PACKAGE_FILE\""
          }
          
          cleanup() {
              rm -f "\$PACKAGE_FILE"
          }
          
          require_openwrt
          detect_installer
          download_package
          install_package
          cleanup
          
          echo "sing-box installation completed."
          EOF
          chmod +x dist/install_openwrt_package.sh

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.VERSION }}
          generate_release_notes: true
          prerelease: ${{ contains(env.VERSION, '-') }}
          overwrite_files: true
          files: |
            sing-box/dist/sing-box_*.ipk
            sing-box/dist/sing-box_*.apk
            sing-box/dist/install_openwrt_package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-openwrt-x86_64-release
          path: |
            sing-box/dist/sing-box_*.ipk
            sing-box/dist/sing-box_*.apk
            sing-box/dist/install_openwrt_package.sh
